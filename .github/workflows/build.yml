name: Build KernelSU for Moto G84

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc libncurses5-dev libssl-dev bison flex libelf-dev zip git clang lld gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Inject KernelSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -

      - name: Compile Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          
          # Carrega o defconfig do Moto G84
          make O=out ARCH=arm64 vendor/bangkk_defconfig || make O=out ARCH=arm64 vendor/sm6375_defconfig || make O=out ARCH=arm64 bangkk_defconfig
          
          # Ativa o KernelSU
          echo "CONFIG_KSU=y" >> out/.config
          
          # Compila o Kernel usando o Clang nativo do sistema
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang HOSTCC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-MotoG84
          path: out/arch/arm64/boot/Image.gz
